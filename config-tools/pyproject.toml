[project]
name = "config-tools"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "certifi==2026.7.22",
    "charset-normalizer==3.4.9",
    "idna==3.18",
    "pwinput>=1.0.3",
    "pynacl>=1.6.2",
    "requests==2.34.2",
    "rich>=15.0.0",
    "types-requests>=2.33.0.20260712",
    "urllib3==2.7.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
]

[[tool.mypy.overrides]]
module = "pwinput"
ignore_missing_imports = true
